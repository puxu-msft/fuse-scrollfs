# scrollz Cargo workspace 根。
#
# 历史：本项目起源是「btrfs+zstd vs FUSE 透明压缩」横向评测 PoC。FUSE 路线转正为产品后，
# 原先各自独立的 fuse/ 与 microbench/ 两个 crate 收敛进本 workspace：统一 Cargo.lock、
# 统一 target/、共享依赖只解析一次、仓库根一键 cargo build / cargo test。
#
# 成员：
#   crates/scrollz                     产品 crate（lib + scrollz 主程序 + mkfixture 离线工具）
#   crates/scrollz-bench               基准二进制（依赖 scrollz 公有 lib API）
#   exp/container-backend-selection  归档 PoC（2026-06-27 redb-vs-sqlite 容器后端选型）
#
# default-members 只含前两者：日常 `cargo build` / `cargo test` 跳过归档 PoC（它拉
# rusqlite { bundled }，需 C 工具链编译 sqlite）。`cargo build --workspace` 才编译 PoC，
# 使其随 workspace 长期保持可编译。
[workspace]
resolver = "2"
members = [
    "crates/scrollz",
    "crates/scrollz-bench",
    "exp/container-backend-selection",
]
default-members = [
    "crates/scrollz",
    "crates/scrollz-bench",
]

# 发布构建优化（perf #3）：compress/decompress 是纯 CPU 热点，lto + 单 codegen-unit 让跨
# crate 内联/优化生效。workspace 下 profile 只在根生效（member crate 的 [profile.*] 被忽略），
# 故从原 fuse/ 与 microbench/ 上提至此。**不设 panic="abort"**：守护进程中单个 FUSE worker
# panic 不应 abort 整个挂载，保留 unwind。
[profile.release]
lto = "thin"
codegen-units = 1

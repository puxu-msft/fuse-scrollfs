[package]
name = "zipfs-microbench"
version = "0.0.0"
edition = "2021"
description = "设计闸门 microbench：redb 作为布局 V 容器存变长压缩 chunk blob 并随机更新，性能是否够用？（见 docs/01-zipfs-design.md §6）"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "zipfs-microbench"
path = "src/main.rs"

[dependencies]
redb = "4.1.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
clap = { version = "4.6.1", features = ["derive"] }
tempfile = "3.27.0"
hdrhistogram = "7.5.4"

[profile.release]
opt-level = 3
lto = "thin"
